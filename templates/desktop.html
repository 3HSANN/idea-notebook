<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__SITE__</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#e9b524"/></linearGradient>
    <linearGradient id="g-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dba81c"/><stop offset="1" stop-color="#b8820e"/></linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8fe8"/><stop offset="1" stop-color="#bfe0ff"/></linearGradient>
    <linearGradient id="g-page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3ebf8"/></linearGradient>
  </defs>
  <symbol id="i-folder" viewBox="0 0 48 48">
    <path d="M4 11a3 3 0 0 1 3-3h10l4 4h20a3 3 0 0 1 3 3v24a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="url(#g-back)"/>
    <path d="M4 18a3 3 0 0 1 3-3h34a3 3 0 0 1 3 3v21a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="url(#g-front)" stroke="#b07d0a" stroke-width="1"/>
  </symbol>
  <symbol id="i-doc" viewBox="0 0 48 48">
    <path d="M10 4h20l10 10v30H10z" fill="url(#g-page)" stroke="#6d7f9e" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M30 4v10h10z" fill="#c9d7f1" stroke="#6d7f9e" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M16 22h18M16 28h18M16 34h11" stroke="#7c98cc" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-image" viewBox="0 0 48 48">
    <rect x="5" y="8" width="38" height="32" rx="2" fill="#fff" stroke="#6d7f9e" stroke-width="1.5"/>
    <rect x="8" y="11" width="32" height="26" fill="url(#g-sky)"/>
    <circle cx="32" cy="19" r="3.5" fill="#ffe36b"/>
    <path d="M8 37v-8l8-6 8 7 6-4 10 6v5z" fill="#4fa83d"/>
  </symbol>
</svg>

<main id="desktop">
  <div class="icons">
    <button type="button" class="dicon" data-open="ideas"><svg class="ico" aria-hidden="true"><use href="#i-folder"/></svg><span>Ideas</span></button>
    <button type="button" class="dicon" data-open="ui"><svg class="ico" aria-hidden="true"><use href="#i-folder"/></svg><span>UI Inspiration</span></button>
  </div>
  <div id="area"></div>
</main>

<noscript><p class="nojs">This site is a desktop that needs JavaScript to open its folders.</p></noscript>

<div id="balloon" role="status" hidden></div>

<div id="smenu" hidden>
  <div class="sm-head">__SITE__</div>
  <div class="sm-body">
    <button type="button" data-open="ideas"><svg class="ico" aria-hidden="true"><use href="#i-folder"/></svg><span>Ideas</span></button>
    <button type="button" data-open="ui"><svg class="ico" aria-hidden="true"><use href="#i-folder"/></svg><span>UI Inspiration</span></button>
  </div>
  <div class="sm-foot"></div>
</div>

<footer id="taskbar">
  <button type="button" id="start" aria-haspopup="true" aria-expanded="false"><span class="bulb" aria-hidden="true"></span>start</button>
  <div id="tasks"></div>
  <div class="tray"><span id="clock"></span></div>
</footer>

<script>window.DATA = __DATA__;</script>
<script src="app.js"></script>
</body>
</html>
